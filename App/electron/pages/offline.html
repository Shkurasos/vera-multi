<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; script-src 'self'">
  <title>VERA Multi — нет подключения</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f0f17; color: #f5f7ff; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
    .drag { position: fixed; inset: 0 0 auto 0; height: 32px; -webkit-app-region: drag; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 0 24px; }
    img { width: 80px; height: 80px; border-radius: 18px; opacity: .9; }
    h1 { margin: 0; font-size: 20px; }
    p { margin: 0; color: #a9adc6; max-width: 420px; }
    button { margin-top: 8px; padding: 10px 22px; border: 0; border-radius: 10px; background: #7c6af7; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #6a58e8; }
    button:focus-visible { outline: 2px solid #c084fc; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="drag"></div>
  <main>
    <img src="../../resources/icon.png" alt="">
    <h1>Нет подключения к серверу</h1>
    <p>Не удалось открыть <strong id="addr">сервер</strong>. Убедитесь, что сервер запущен (<code>cd Server</code>, <code>npm start</code>).</p>
    <p>После первого успешного входа чаты, музыка и тема открываются и без сети.</p>
    <button id="retry" type="button">Повторить</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="offline.js"></script>
</body>
</html>
