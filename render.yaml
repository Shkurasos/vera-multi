# render.yaml — деплой Vera Multi на Render Free (без карты).
# Free-тариф НЕ поддерживает persistent disk: данные vera.json и uploads/
# живут внутри контейнера и теряются при редеплое/рестарте.
# Для постоянного хранения — обновить план или подключить внешнюю БД.
services:
  - type: web
    name: vera-multi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/downloads
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/vera
      - key: UPLOADS_DIR
        value: /tmp/vera/uploads
      - key: DB_FILE
        value: /tmp/vera/vera.json
      - key: JWT_SECRET
        generateValue: true

