# render.yaml — деплой Vera Multi на Render Free (без карты).
# Free-тариф НЕ поддерживает persistent disk: данные vera.json и uploads/
# живут внутри контейнера и теряются при редеплое/рестарте.
# Для постоянного хранения — обновить план или подключить внешнюю БД.
services:
  - type: web
    name: vera-multi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/downloads
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/vera
      - key: UPLOADS_DIR
        value: /tmp/vera/uploads
      - key: DB_FILE
        value: /tmp/vera/vera.json
      # SEC: JWT_SECRET Render генерирует сам (32+ байта).
      - key: JWT_SECRET
        generateValue: true
      # Крипто-кошелёк NOWPayments. Оба ключа — из личного кабинета
      # nowpayments.io (см. DEPLOY.md, раздел «Крипто-кошелёк»).
      # Пока не задан — /api/wallet/topup работает в mock-режиме.
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      # Опционально: белый список Origin для CORS (CSV). Публичный URL Render
      # добавляется автоматически (RENDER_EXTERNAL_URL). Заполнять, если
      # десктоп/Electron подключается с кастомного origin.
      - key: CORS_ORIGIN
        sync: false

