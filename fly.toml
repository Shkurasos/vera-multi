# fly.toml — Vera Multi (сервер + Web) на Fly.io
# Регион ams (Амстердам) даёт лучшую задержку из СНГ. Меняйте на удобный.
app = "vera-koto"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"
  UPLOADS_DIR = "/data/uploads"
  # Старый открытый JSON: читается один раз для импорта, затем не используется.
  DB_FILE = "/data/vera.json"
  # Зашифрованное хранилище (node:sqlite, AES-256-GCM). STORE_DRIVER=json — откат.
  STORE_FILE = "/data/vera-store.db"
  # Секреты НЕ здесь (файл в git), а через:
  #   fly secrets set JWT_SECRET=... VERA_KEK=... ADMIN_USERNAMES=...
  # Без JWT_SECRET, VERA_KEK или ADMIN_USERNAMES сервер в проде не стартует.

# 3 GB бесплатного persistent-volume. Создаётся отдельно: fly volumes create vera_data --region ams --size 3
[[mounts]]
  source = "vera_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Не выключаем машину при простое — WebSocket-соединения должны жить.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
