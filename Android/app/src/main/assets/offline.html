<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
  <title>VERA Multi — нет подключения</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f0f17; color: #f5f7ff; font: 15px/1.45 system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 0 24px; box-sizing: border-box; }
    h1 { margin: 0; font-size: 20px; }
    p { margin: 0; color: #a9adc6; max-width: 420px; }
    button { margin-top: 8px; padding: 12px 26px; border: 0; border-radius: 12px; background: #7c6af7; color: #fff; font: inherit; font-weight: 600; }
    button:focus-visible { outline: 2px solid #c084fc; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Нет подключения к серверу</h1>
    <p>Не удалось открыть <strong id="addr">сервер</strong>. Убедитесь, что сервер на ПК запущен и телефон подключён по USB (<code>adb reverse tcp:3000 tcp:3000</code>).</p>
    <p>После первого успешного входа чаты, музыка и тема открываются и без сети.</p>
    <button id="retry" type="button">Повторить</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="offline.js"></script>
</body>
</html>
